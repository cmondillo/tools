# Fly.io. From the project root: `fly launch --config deploy/fly.toml --dockerfile api/Dockerfile`
# Docs: https://fly.io/docs/reference/configuration/
app = "link-preview-cache-api"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"

[env]
  X402_PRICE_USD = "$0.003"
  X402_NETWORK = "eip155:84532" # switch to eip155:8453 (Base mainnet) to go live for real
  X402_FACILITATOR_URL = "https://x402.org/facilitator"
  CACHE_DB_PATH = "./data/cache.db"
  CACHE_TTL_SECONDS = "21600"
  # X402_PAY_TO_ADDRESS is a secret, not an env var here:
  # fly secrets set X402_PAY_TO_ADDRESS=0xYourRealWallet

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
