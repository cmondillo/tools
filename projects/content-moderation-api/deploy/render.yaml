# Render Blueprint. In the Render dashboard: New -> Blueprint -> point at
# this repo -> Blueprint path: projects/content-moderation-api/deploy/render.yaml
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: content-moderation-api
    runtime: docker
    # Resolved relative to the REPO ROOT, not this render.yaml's own folder
    # (learned the hard way on link-preview-api's first deploy attempt).
    dockerfilePath: ./projects/content-moderation-api/api/Dockerfile
    dockerContext: ./projects/content-moderation-api/api
    # "free" = Render's no-cost web service tier: no billing info needed.
    # Trade-off: spins down after 15 min idle, ~50s cold start on the next
    # request.
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: X402_PAY_TO_ADDRESS
        sync: false # set this in the Render dashboard to your real payout wallet
      - key: X402_PRICE_USD
        value: "$0.005"
      - key: X402_NETWORK
        value: eip155:84532 # switch to eip155:8453 (Base mainnet) to go live for real
      - key: X402_FACILITATOR_URL
        value: https://x402.org/facilitator
