# Render Blueprint. In the Render dashboard: New -> Blueprint -> point at
# this repo -> it finds this file automatically.
# Blueprint path to enter in the dashboard: projects/link-preview-api/deploy/render.yaml
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: link-preview-api
    runtime: docker
    # Render resolves these two paths relative to the REPO ROOT, not to this
    # render.yaml's own folder - hence the full path from the repo root here.
    dockerfilePath: ./projects/link-preview-api/api/Dockerfile
    dockerContext: ./projects/link-preview-api/api
    # "free" = Render's no-cost web service tier: no billing info needed.
    # Trade-off: spins down after 15 min idle, ~50s cold start on the next
    # request. Fine to prove the API works; upgrade to "starter" ($7/mo)
    # once real traffic makes cold starts annoying for paying agents.
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: X402_PAY_TO_ADDRESS
        sync: false # set this in the Render dashboard to your real payout wallet
      - key: X402_PRICE_USD
        value: "$0.01"
      - key: X402_NETWORK
        value: eip155:84532 # switch to eip155:8453 (Base mainnet) to go live for real
      - key: X402_FACILITATOR_URL
        value: https://x402.org/facilitator
